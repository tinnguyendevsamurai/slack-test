modules:
  jira:issuePanel:
    - key: check-list-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: Check List
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/49fdee89-d25c-4e2e-b4e4-b1d6051b58b3
