name: Deploy Forge App

on:
  push:
    branches:
      - develop
      - master

jobs:
  # ── Staging (develop branch) ───────────────────────────────────────────────
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install root dependencies
        run: npm ci

      - name: Install and build frontend
        working-directory: static/hello-world
        run: |
          npm ci
          npm run build

      - name: Install Forge CLI
        run: npm install -g @forge/cli

      - name: Enable usage analytics
        run: forge settings set usage-analytics true

      - name: Deploy to Staging
        run: forge deploy -e development --non-interactive --verbose
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

      # - name: Install to staging site
      #   run: forge install --site tinds.atlassian.net --product jira --non-interactive -e development --verbose
      #   env:
      #     FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      #     FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

  # ── Production (master branch) ────────────────────────────────────────────
  deploy-production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install root dependencies
        run: npm ci

      - name: Install and build frontend
        working-directory: static/hello-world
        run: |
          npm ci
          npm run build

      - name: Install Forge CLI
        run: npm install -g @forge/cli

      - name: Enable usage analytics
        run: forge settings set usage-analytics true

      - name: Deploy to Production
        run: forge deploy -e production --non-interactive --verbose
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
