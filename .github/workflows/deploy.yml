name: Deploy Forge App

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install root dependencies
        run: npm ci

      - name: Install and build frontend
        working-directory: static/hello-world
        run: |
          npm ci
          npm run build

      - name: Install Forge CLI
        run: npm install -g @forge/cli

      - name: Enable usage analytics
        run: forge settings set usage-analytics true

      - name: Deploy to Forge
        run: forge deploy -e development --non-interactive --verbose
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
